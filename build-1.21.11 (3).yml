                  if (!GambleManager.enabled) return;
                  List<GambleManager.Gamble> list = GambleManager.pending();
                  if (list.isEmpty()) return;
                  Font f = Minecraft.getInstance().font;
                  int shown = Math.min(8, list.size());

                  int w = f.width("CURRENT GAMBLES") + 12;
                  for (int i = 0; i < shown; i++) {
                      GambleManager.Gamble gb = list.get(i);
                      w = Math.max(w, f.width(gb.name) + f.width("$" + Money.format(gb.amount)) + 28);
                  }
                  int x = 6, y = 40, h = 8 + 12 + shown * 11 + (list.size() > shown ? 11 : 0);

                  g.fill(x, y, x + w, y + h, 0xE6000000);
                  int gold = 0xFFC8A040;
                  g.fill(x, y, x + w, y + 1, gold);
                  g.fill(x, y + h - 1, x + w, y + h, gold);
                  g.fill(x, y, x + 1, y + h, gold);
                  g.fill(x + w - 1, y, x + w, y + h, gold);

                  g.drawString(f, "CURRENT GAMBLES", x + 6, y + 5, gold);
                  for (int i = 0; i < shown; i++) {
                      GambleManager.Gamble gb = list.get(i);
                      int ly = y + 18 + i * 11;
                      g.drawString(f, gb.name, x + 6, ly, 0xFFFFFFFF);
                      String amt = "$" + Money.format(gb.amount);
                      g.drawString(f, amt, x + w - 6 - f.width(amt), ly, 0xFFFFD36B);
                  }
                  if (list.size() > shown) {
                      g.drawString(f, "+" + (list.size() - shown) + " more", x + 6, y + 18 + shown * 11, 0xFFB0B0B0);
                  }
              }
          }
