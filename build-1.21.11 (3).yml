          package com.example.donutauction;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.network.chat.Component;

          import java.util.List;

          public class GambleScreen extends Screen {
              private static final int PW = 280, ROW = 22, MAX = 10;
              private List<GambleManager.Gamble> view;
              private int px, py, ph;

              public GambleScreen() {
                  super(Component.literal("Gambles"));
              }

              @Override
              protected void init() {
                  view = GambleManager.recent(MAX);
                  ph = 30 + Math.max(1, view.size()) * ROW + 30;
                  px = (this.width - PW) / 2;
                  py = (this.height - ph) / 2;

                  for (int i = 0; i < view.size(); i++) {
                      final GambleManager.Gamble gb = view.get(i);
                      if (gb.status != GambleManager.Status.PENDING) continue;
                      int y = py + 28 + i * ROW;
                      addRenderableWidget(Button.builder(Component.literal("X"), b -> { GambleManager.lose(gb); rebuildWidgets(); })
                              .bounds(px + PW - 10 - 20, y, 20, 18).build());
                      addRenderableWidget(Button.builder(Component.literal("WIN $" + Money.format(gb.payout())),
                                      b -> { GambleManager.win(gb); rebuildWidgets(); })
                              .bounds(px + PW - 10 - 20 - 4 - 78, y, 78, 18).build());
                  }

                  int by = py + ph - 24;
                  addRenderableWidget(Button.builder(Component.literal("Clear finished"), b -> { GambleManager.clearFinished(); rebuildWidgets(); })
                          .bounds(px + 10, by, 100, 18).build());
                  addRenderableWidget(Button.builder(Component.literal("Tracking: " + (GambleManager.enabled ? "ON" : "OFF")),
                                  b -> { GambleManager.enabled = !GambleManager.enabled; rebuildWidgets(); })
                          .bounds(px + PW - 10 - 100, by, 100, 18).build());
              }

              @Override
              public void renderBackground(GuiGraphics g, int mouseX, int mouseY, float partial) {
                  super.renderBackground(g, mouseX, mouseY, partial);
                  g.fill(px, py, px + PW, py + ph, 0xF0000000);
                  int gold = 0xFFC8A040;
                  g.fill(px, py, px + PW, py + 1, gold);
                  g.fill(px, py + ph - 1, px + PW, py + ph, gold);
                  g.fill(px, py, px + 1, py + ph, gold);
                  g.fill(px + PW - 1, py, px + PW, py + ph, gold);
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partial) {
                  super.render(g, mouseX, mouseY, partial);
                  g.drawString(this.font, "GAMBLES · WIN pays 2x · X = lost", px + 10, py + 10, 0xFFC8A040);
                  if (view.isEmpty()) {
                      g.drawString(this.font, "No gambles yet. When someone pays you, it shows up here.", px + 10, py + 34, 0xFF888888);
                      return;
                  }
                  for (int i = 0; i < view.size(); i++) {
                      GambleManager.Gamble gb = view.get(i);
                      int y = py + 28 + i * ROW + 5;
                      g.drawString(this.font, gb.name, px + 10, y, 0xFFFFFFFF);
                      g.drawString(this.font, "$" + Money.format(gb.amount), px + 10 + 92, y, 0xFFFFD36B);
                      if (gb.status == GambleManager.Status.WON) {
                          g.drawString(this.font, "WON · paid $" + Money.format(gb.payout()), px + PW - 10 - 110, y, 0xFF7DFF7D);
                      } else if (gb.status == GambleManager.Status.LOST) {
                          g.drawString(this.font, "LOST", px + PW - 10 - 30, y, 0xFFFF6B6B);
                      }
                  }
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (event.key() == InputConstants.KEY_G) {
                      onClose();
                      return true;
                  }
                  return super.keyPressed(event);
              }
          }
