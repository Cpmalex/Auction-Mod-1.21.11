          package com.example.donutauction;

          import net.minecraft.client.Minecraft;
          import net.minecraft.network.chat.Component;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class GambleManager {
              public enum Status { PENDING, WON, LOST }

              public static final class Gamble {
                  public final String name;
                  public final double amount;
                  public Status status = Status.PENDING;

                  Gamble(String name, double amount) {
                      this.name = name;
                      this.amount = amount;
                  }

                  public long payout() {
                      return (long) Math.floor(amount * 2);
                  }
              }

              private static final Pattern PAID = Pattern.compile(
                      "(\\w{3,16})\\s+paid you\\s+\\S*?\\s*(\\d[\\d,]*(?:\\.\\d+)?\\s*[kKmMbB]?)\\s*$");

              /** When on, every "X paid you $N" becomes a gamble (and is NOT counted as an auction bid). */
              public static boolean enabled = true;
              public static final List<Gamble> ALL = new ArrayList<>();

              private GambleManager() {}

              public static void onChat(String plain) {
                  if (!enabled || plain == null) return;
                  Matcher m = PAID.matcher(plain.trim());
                  if (!m.find()) return;
                  double amt = Money.parse(m.group(2).replaceAll("\\s", ""));
                  if (Double.isNaN(amt) || amt <= 0) return;
                  ALL.add(new Gamble(m.group(1), amt));
                  say("[Gamble] " + m.group(1) + " bet $" + Money.format(amt) + " (win pays $" + Money.format(amt * 2) + ")");
              }

              public static List<Gamble> pending() {
                  List<Gamble> out = new ArrayList<>();
                  for (Gamble g : ALL) if (g.status == Status.PENDING) out.add(g);
                  return out;
              }

              /** Newest first, at most n. */
              public static List<Gamble> recent(int n) {
                  List<Gamble> out = new ArrayList<>();
                  for (int i = ALL.size() - 1; i >= 0 && out.size() < n; i--) out.add(ALL.get(i));
                  return out;
              }

              /** Player won: pay them double their bet with /pay. Runs once per gamble. */
              public static void win(Gamble g) {
                  if (g.status != Status.PENDING) return;
                  g.status = Status.WON;
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.getConnection() != null) {
                      mc.getConnection().sendCommand("pay " + g.name + " " + g.payout());
                  }
                  say("[Gamble] " + g.name + " WON · paid $" + Money.format(g.payout()));
              }

              public static void lose(Gamble g) {
                  if (g.status != Status.PENDING) return;
                  g.status = Status.LOST;
                  say("[Gamble] " + g.name + " lost $" + Money.format(g.amount));
              }

              public static void clearFinished() {
                  ALL.removeIf(g -> g.status != Status.PENDING);
              }

              private static void say(String s) {
                  Minecraft mc = Minecraft.getInstance();
                  ChatUtil.say(s);
              }
          }
