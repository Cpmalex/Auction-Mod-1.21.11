          package com.example.donutauction;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.KeyEvent;
          import net.minecraft.client.input.MouseButtonEvent;
          import net.minecraft.network.chat.Component;

          public class HudMoveScreen extends Screen {
              private boolean dragging;

              public HudMoveScreen() {
                  super(Component.literal("Move auction HUD"));
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partial) {
                  super.render(g, mouseX, mouseY, partial);
                  AuctionHud.draw(g, true);
                  g.drawCenteredString(this.font, "Drag the box · press H or Esc to save", this.width / 2, 12, 0xFFFFFFFF);
              }

              @Override
              public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {
                  int[] p = AuctionHud.position(true);
                  int[] s = AuctionHud.size(true);
                  dragging = event.x() >= p[0] && event.x() <= p[0] + s[0] && event.y() >= p[1] && event.y() <= p[1] + s[1];
                  return dragging || super.mouseClicked(event, doubleClick);
              }

              @Override
              public boolean mouseDragged(MouseButtonEvent event, double dx, double dy) {
                  if (dragging) {
                      int[] p = AuctionHud.position(true);
                      AuctionConfig.INSTANCE.hudX = (int) (p[0] + dx);
                      AuctionConfig.INSTANCE.hudY = (int) (p[1] + dy);
                      return true;
                  }
                  return super.mouseDragged(event, dx, dy);
              }

              @Override
              public boolean mouseReleased(MouseButtonEvent event) {
                  dragging = false;
                  return super.mouseReleased(event);
              }

              @Override
              public boolean keyPressed(KeyEvent event) {
                  if (event.key() == InputConstants.KEY_H) {
                      onClose();
                      return true;
                  }
                  return super.keyPressed(event);
              }

              @Override
              public void onClose() {
                  AuctionConfig.save();
                  super.onClose();
              }
          }
